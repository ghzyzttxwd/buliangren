name: Deploy static game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static files
        run: |
          node --check sw.js
          for file in src/*.js; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Smoke test UI baseline
        run: node --experimental-default-type=module tests/ui-smoke.mjs
      - name: Smoke test world map UX
        run: node --experimental-default-type=module tests/world-map-ui-smoke.mjs
      - name: Smoke test party and skills UX
        run: node --experimental-default-type=module tests/party-skills-ui-smoke.mjs
      - name: Smoke test inventory and shop UX
        run: node --experimental-default-type=module tests/inventory-shop-ui-smoke.mjs
      - name: Smoke test battle UX
        run: node --experimental-default-type=module tests/battle-ui-smoke.mjs
      - name: Smoke test feedback and empty states UX
        run: node --experimental-default-type=module tests/feedback-ui-smoke.mjs
      - name: Smoke test v0.5 inventory regression
        run: node --experimental-default-type=module tests/v05-inventory-regression.mjs
      - name: Smoke test battle baseline
        run: node --experimental-default-type=module tests/battle-smoke.mjs
      - name: Smoke test season one from new save
        run: node --experimental-default-type=module tests/season1-smoke.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
